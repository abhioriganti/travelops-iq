version: 2

sources:
  - name: raw
    description: Source-shaped data in Snowflake RAW. Core travel events are synthetic; weather observations come from the public Open-Meteo historical API, hotel properties from Geoapify Places, and flight-offer snapshots from Duffel's test environment.
    database: TRAVEL_ANALYTICS
    schema: RAW
    tables:
      - name: raw_employees
        description: One record per fictional employee.
        columns:
          - name: employee_id
            tests: [not_null, unique]
      - name: raw_trips
        description: One record per booked trip.
        columns:
          - name: trip_id
            tests: [not_null, unique]
          - name: employee_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'raw_employees')
                    field: employee_id
      - name: raw_booking_events
        description: One event in a traveler booking journey; trip_id is null for abandoned sessions.
        columns:
          - name: event_id
            tests: [not_null, unique]
      - name: raw_expenses
        description: One expense line submitted against a trip.
        columns:
          - name: expense_id
            tests: [not_null, unique]
          - name: trip_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'raw_trips')
                    field: trip_id
      - name: raw_policy_evaluations
        description: One policy evaluation per trip in this source snapshot.
        columns:
          - name: policy_evaluation_id
            tests: [not_null, unique]
          - name: trip_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'raw_trips')
                    field: trip_id
      - name: raw_support_cases
        description: One support case associated with a trip.
        columns:
          - name: support_case_id
            tests: [not_null, unique]
          - name: trip_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'raw_trips')
                    field: trip_id
      - name: raw_weather_observations
        description: Public historical weather observed at synthetic trip destinations. No traveler or trip identifiers are sent to the external API.
        columns:
          - name: location_code
            tests: [not_null]
          - name: weather_date
            tests: [not_null]
          - name: source
            tests:
              - accepted_values:
                  arguments:
                    values: ['open_meteo_archive']
      - name: raw_flight_offer_snapshots
        description: Anonymous, non-bookable Duffel test-mode flight-offer snapshots. Prices and schedules are sandbox data, not market data.
        columns:
          - name: offer_request_id
            tests: [not_null]
          - name: offer_id
            tests: [not_null]
          - name: environment
            tests:
              - accepted_values:
                  arguments:
                    values: ['test']
          - name: source
            tests:
              - accepted_values:
                  arguments:
                    values: ['duffel_test']
      - name: raw_hotel_properties
        description: Bounded external hotel-property discovery records from Geoapify Places. These records do not represent hotel rates, inventory, or bookings.
        columns:
          - name: destination_city_code
            tests: [not_null]
          - name: place_id
            tests: [not_null]
          - name: source
            tests:
              - accepted_values:
                  arguments:
                    values: ['geoapify_places']
